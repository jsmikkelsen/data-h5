#cloud-config
# ==============================================================================
# Cloud-Init User-Data: Enterprise Golden Template
# Placering på Proxmox vært: /var/lib/vz/snippets/golden-userdata.yaml
# ==============================================================================

# 1. Automatisk opdatering af systemet ved første boot
package_update: true
package_upgrade: true

# 2. Sikkerheds- og systempakker
packages:
  - nginx
  - qemu-guest-agent
  - fail2ban
  - ufw
  - curl
  - htop

# 3. Tidszone
timezone: Europe/Copenhagen

# 4. Web Dashboard
write_files:
  - path: /var/www/html/index.html
    owner: www-data:www-data
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="da">
      <head>
          <meta charset="UTF-8">
          <title>Enterprise Golden Server</title>
          <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
              .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; max-width: 500px; }
              h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 0.5rem; }
              .badge { display: inline-block; padding: 0.25rem 0.75rem; background: #0284c7; color: white; border-radius: 9999px; font-size: 0.85rem; margin-bottom: 1.5rem; }
              .info-box { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #334155; text-align: left; }
              .label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
              .value { font-family: monospace; font-size: 1.1rem; color: #4ade80; margin-top: 0.2rem; }
          </style>
      </head>
      <body>
          <div class="card">
              <span class="badge">Enterprise Golden Server</span>
              <h1>Proxmox + Cloud-Init</h1>
              <p style="color: #94a3b8;">Server klargjort automatisk uden manuel konfiguration.</p>
              <div class="info-box">
                  <div class="label">Server Hostname</div>
                  <div class="value" id="host">HOSTNAME_PLACEHOLDER</div>
                  <div class="label" style="margin-top: 0.8rem;">Sikkerhed & Status</div>
                  <div class="value">Aktiv (Fail2Ban + UFW + Nginx)</div>
              </div>
          </div>
      </body>
      </html>

# 5. Kørsel af systemkommandoer ved boot
runcmd:
  - sed -i "s/HOSTNAME_PLACEHOLDER/$(hostname)/g" /var/www/html/index.html
  - systemctl enable --now qemu-guest-agent
  - systemctl enable --now fail2ban
  - systemctl restart nginx
