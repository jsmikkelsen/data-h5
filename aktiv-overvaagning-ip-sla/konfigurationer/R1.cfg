! ========================================================
! R1 - Virksomhedens Hovedrouter
! Konfiguration for Aktiv Overvågning via IP SLA & Object Tracking
! ========================================================
hostname R1
!
no ip domain lookup
!
! LAN Interface mod klienter
interface GigabitEthernet0/0
 description LAN Interface mod klienter
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
! Primær WAN-forbindelse mod R2
interface GigabitEthernet0/1
 description Mod R2 (Primaer vej)
 ip address 10.1.12.1 255.255.255.252
 no shutdown
!
! Backup WAN-forbindelse mod R3
interface GigabitEthernet0/2
 description Mod R3 (Backup vej)
 ip address 10.1.13.1 255.255.255.252
 no shutdown
!
! Fastlaas rute for IP SLA maaling direkte mod R2 (forhindrer route-flapping loop)
ip route 172.16.1.1 255.255.255.255 10.1.12.2
!
! --------------------------------------------------------
! Del 5: IP SLA Operation 10 (ICMP Echo Reachability)
! --------------------------------------------------------
ip sla 10
 icmp-echo 172.16.1.1 source-interface GigabitEthernet0/1
 frequency 5
 timeout 2000
 threshold 2000
exit
ip sla schedule 10 life forever start-time now
!
! --------------------------------------------------------
! Del 7: Object Tracking bundet til IP SLA 10
! Dampening: 10s down delay (undgaar transient pakketab), 15s up delay (sikrer linkstabilitet)
! --------------------------------------------------------
track 10 ip sla 10 reachability
 delay down 10 up 15
exit
!
! --------------------------------------------------------
! Del 8: Routing med Tracking & Floating Static Route
! --------------------------------------------------------
! Primaer default rute: aktiv saa laenge Track 10 er UP (AD = 1)
ip route 0.0.0.0 0.0.0.0 10.1.12.2 track 10
! Backup default rute: floating static route (AD = 200)
ip route 0.0.0.0 0.0.0.0 10.1.13.3 200
!
! --------------------------------------------------------
! Del 11: Ekstra IP SLA Operation 20 (TCP Connect - Web Service Port 80)
! --------------------------------------------------------
ip sla 20
 tcp-connect 172.16.1.1 80 source-interface GigabitEthernet0/1
 frequency 5
 timeout 2000
 threshold 2000
exit
ip sla schedule 20 life forever start-time now
!
end
