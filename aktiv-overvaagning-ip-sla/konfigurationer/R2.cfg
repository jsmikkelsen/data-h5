! ========================================================
! R2 - Primaer Transit Router (/30 Standard)
! ========================================================
hostname R2
!
no ip domain lookup
!
interface GigabitEthernet0/1
 description Mod R1 (Primaer)
 ip address 10.1.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description Mod Server (Destination)
 ip address 10.1.24.1 255.255.255.252
 no shutdown
!
! Routing mod ekstern destination (Server Loopback: 172.16.1.1/32 via Server ens4)
ip route 172.16.1.1 255.255.255.255 10.1.24.2
!
! Retur-routing mod virksomhedens LAN
ip route 192.168.10.0 255.255.255.0 10.1.12.1
!
end
