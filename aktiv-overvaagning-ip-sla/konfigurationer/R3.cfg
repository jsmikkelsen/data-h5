! ========================================================
! R3 - Backup Transit Router (/30 Standard)
! ========================================================
hostname R3
!
no ip domain lookup
!
interface GigabitEthernet0/2
 description Mod R1 (Backup)
 ip address 10.1.13.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/0
 description Mod Server (Destination)
 ip address 10.1.34.1 255.255.255.252
 no shutdown
!
! Routing mod ekstern destination (Server Loopback: 172.16.1.1/32 via Server ens5)
ip route 172.16.1.1 255.255.255.255 10.1.34.2
!
! Retur-routing mod virksomhedens LAN
ip route 192.168.10.0 255.255.255.0 10.1.13.1
!
end
