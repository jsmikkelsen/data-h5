! ========================================================
! R4 - Ekstern Test Destination og Webserver
! ========================================================
hostname R4
!
no ip domain lookup
!
! Ekstern destination loopback
interface Loopback0
 description Ekstern test-destination
 ip address 172.16.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Mod R2 (Primaer vej)
 ip address 10.1.24.4 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Mod R3 (Backup vej)
 ip address 10.1.34.4 255.255.255.252
 no shutdown
!
! Returveje til virksomhedens LAN:
! Primaer returvej via R2 (AD = 1):
ip route 192.168.10.0 255.255.255.0 10.1.24.2
! Backup returvej via R3 som Floating Static Route (AD = 200):
ip route 192.168.10.0 255.255.255.0 10.1.34.3 200
!
! --------------------------------------------------------
! Del 11: HTTP-tjeneste til TCP Connect (Port 80) test
! --------------------------------------------------------
ip http server
ip http authentication local
username admin privilege 15 secret cisco
!
end
