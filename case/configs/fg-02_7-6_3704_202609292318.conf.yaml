    system_automation-trigger:
        - "Compromised Host":
            description: "An incident of compromise has been detected on a host endpoint."

        - "Any Security Rating Notification":
            description: "A security rating summary report has been generated."
            event-type: security-rating-summary
            report-type: any

        - "AV & IPS DB update":
            description: "The antivirus and IPS database has been updated."
            event-type: virus-ips-db-updated

        - "Configuration Change":
            description: "An administrator's session that changed a FortiGate's configuration has ended."
            event-type: config-change

        - "Conserve Mode":
            description: "A FortiGate has entered conserve mode due to low memory."
            event-type: low-memory

        - "HA Failover":
            description: "A HA failover has occurred."
            event-type: ha-failover

        - "High CPU":
            description: "A FortiGate has high CPU usage."
            event-type: high-cpu

        - "License Expiry":
            description: "A FortiGate license is near expiration."
            event-type: license-near-expiry
            license-type: any

        - "Reboot":
            description: "A FortiGate is rebooted."
            event-type: reboot

        - "Anomaly Logs":
            description: "An anomalous event has occurred."
            event-type: anomaly-logs

        - "IPS Logs":
            description: "An IPS event has occurred."
            event-type: ips-logs

        - "SSH Logs":
            description: "An SSH event has occurred."
            event-type: ssh-logs

        - "Traffic Violation":
            description: "A traffic policy has been violated."
            event-type: traffic-violation

        - "Virus Logs":
            description: "A virus event has occurred."
            event-type: virus-logs

        - "Webfilter Violation":
            description: "A webfilter policy has been violated."
            event-type: webfilter-violation

        - "Admin Login":
            description: "A FortiOS event with specified log ID has occurred."
            event-type: event-log
            logid: 32001

        - "Incoming Webhook Call":
            description: "An incoming webhook call is received"
            event-type: incoming-webhook

        - "Weekly Trigger":
            trigger-type: scheduled
            trigger-frequency: weekly
            trigger-weekday: tuesday
            trigger-hour: 10

        - "FortiAnalyzer Connection Down":
            description: "A FortiAnalyzer connection is down."
            event-type: event-log
            logid: 22902

        - "Network Down":
            description: "A network connection is down."
            event-type: event-log
            logid: 20099
            fields:
                - "1":
                    name: "status"
                    value: "DOWN"



        - "Local Certificate Expiry":
            description: "A local certificate is near expiration."
            event-type: local-cert-near-expiry

        - "Auto Firmware Upgrade":
            description: "Automatic firmware upgrade."
            event-type: event-log
            logid: [22095, 22097]

        - "Auto Firmware Upgrade Complete":
            description: "Automatic firmware upgrade complete successfully."
            event-type: event-log
            logid: [22096, 22094]

        - "Auto Firmware Upgrade Scheduled":
            description: "Automatic firmware upgrade scheduled."
            event-type: event-log
            logid: 32263

        - "Auto Firmware Upgrade Cancelled":
            description: "Automatic firmware upgrade cancelled."
            event-type: event-log
            logid: 32325

        - "Super Admin Creation":
            description: "A super admin is created."
            event-type: event-log
            logid: 44560


    system_automation-action:
        - "Access Layer Quarantine":
            description: "Quarantine the MAC address on access layer devices (FortiSwitch and FortiAP)."
            action-type: quarantine

        - "FortiClient Quarantine":
            description: "Use FortiClient EMS to quarantine the endpoint device."
            action-type: quarantine-forticlient

        - "FortiNAC Quarantine":
            description: "Use FortiNAC to quarantine the endpoint device."
            action-type: quarantine-fortinac

        - "IP Ban":
            description: "Ban the IP address specified in the automation trigger event."
            action-type: ban-ip

        - "FortiExplorer Notification":
            description: "Automation action configuration for sending a notification to any FortiExplorer mobile application."
            action-type: fortiexplorer-notification

        - "Email Notification":
            description: "Send a custom email to the specified recipient(s)."
            action-type: email
            forticare-email: enable
            email-subject: "%%log.logdesc%%"

        - "CLI Script - System Status":
            description: "Execute a CLI script to return the system status."
            action-type: cli-script
            script: "get system status"
            accprofile: "super_admin_readonly"

        - "Reboot FortiGate":
            description: "Reboot this FortiGate unit."
            action-type: system-actions
            system-action: reboot
            minimum-interval: 300

        - "Shutdown FortiGate":
            description: "Shut down this FortiGate unit."
            action-type: system-actions
            system-action: shutdown

        - "Backup Config Disk":
            description: "Backup the configuration on disk."
            action-type: system-actions
            system-action: backup-config

        - "Auto Upgrade Complete Email Notification":
            description: "Send auto upgrade complete email notification to the FortiCare email address registered on this device."
            action-type: email
            forticare-email: enable
            email-subject: "Firmware Update Notification : %%log.devname%%"
            message: "<p>An automated firmware upgrade has completed successfully. The device <strong> %%log.devname%%</strong>(Serial Number: <strong>%%log.devid%%</strong>) was updated to firmware version <strong>%%log.version%%</strong> on <strong>%%log.date%% %%log.time%%</strong>.</p><p>This is an informational notification that was automatically generated by your Fortinet FortiGate device. If you would like to stop receiving these notifications, please follow the steps below:</p><ol><li>Log in to the FortiGate Administrative GUI</li><li>Navigate to <strong>Security Fabric</strong> &rarr; <strong>Automation</strong> &rarr; <strong>Stitch</strong></li><li>Under the <strong>FortiOS Event Log</strong> section, select <strong>%%stitch.name%%</strong></li><li>Click <strong>Set Status</strong>, and choose <strong>Disabled</strong></li></ol>"
            replacement-message: enable

        - "Auto Upgrade Scheduled Email Notification":
            description: "Send scheduled auto upgrade email notification to the FortiCare email address registered on this device."
            action-type: email
            forticare-email: enable
            email-subject: "Firmware Update Scheduled Notification : %%log.devname%%"
            message: "<p>Date: <strong>%%log.date%%</strong> Time: <strong>%%log.time%%</strong><br>An automated firmware update has been scheduled on device: <strong>%%log.devname%%</strong>(Serial Number: <strong>%%log.devid%%</strong>).<br>%%log.msg%%</p><p>This is an informational notification that was automatically generated by your Fortinet FortiGate device. If you would like to stop receiving these notifications, please follow the steps below:</p><ol><li>Log in to the FortiGate Administrative GUI</li><li>Navigate to <strong>Security Fabric</strong> &rarr; <strong>Automation</strong> &rarr; <strong>Stitch</strong></li><li>Under the <strong>FortiOS Event Log</strong> section, select <strong>%%stitch.name%%</strong></li><li>Click <strong>Set Status</strong>, and choose <strong>Disabled</strong></li></ol>"
            replacement-message: enable

        - "Auto Upgrade Cancelled Email Notification":
            description: "Send auto upgrade cancelled email notification to the FortiCare email address registered on this device."
            action-type: email
            forticare-email: enable
            email-subject: "Firmware Update Cancelled Notification : %%log.devname%%"
            message: "<p>Date: <strong>%%log.date%%</strong> Time: <strong>%%log.time%%</strong><br>An automated firmware update has been cancelled on device: <strong>%%log.devname%%</strong>(Serial Number: <strong>%%log.devid%%</strong>).<p>This is an informational notification that was automatically generated by your Fortinet FortiGate device. If you would like to stop receiving these notifications, please follow the steps below:</p><ol><li>Log in to the FortiGate Administrative GUI</li><li>Navigate to <strong>Security Fabric</strong> &rarr; <strong>Automation</strong> &rarr; <strong>Stitch</strong></li><li>Under the <strong>FortiOS Event Log</strong> section, select <strong>%%stitch.name%%</strong></li><li>Click <strong>Set Status</strong>, and choose <strong>Disabled</strong></li></ol>"
            replacement-message: enable


